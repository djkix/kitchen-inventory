name: CI

on:
  push:
    branches: [main]
  # Les PR ouvertes par release-please ne touchent que ces deux fichiers :
  # les ignorer évite de déclencher la CI dessus.
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - ".release-please-manifest.json"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Types, lint et tests sur tout le monorepo. Les tests d'intégration API
  # tournent sur un PostgreSQL 16 jetable, même version qu'en production.
  # Aucun test ne touche le réseau : Open Food Facts et la vision sont rejoués
  # depuis des fixtures.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://kitchen:kitchen@localhost:5432/kitchen_test
      # Requis par « prisma generate » pour valider le datasource, jamais ouvert.
      DATABASE_URL: postgresql://kitchen:kitchen@localhost:5432/kitchen_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run build -w @kitchen/shared
      - name: Vérification des types
        run: npm run typecheck --workspaces --if-present
      # `e2e/` n'est pas un espace de travail npm : le step ci-dessus ne le
      # voit pas, et Playwright efface les types sans les vérifier. Sans ce
      # step, une erreur de type dans un parcours ne se verrait qu'à
      # l'exécution du job `e2e`, sur `main` uniquement.
      - name: Vérification des types des parcours bout en bout
        run: npm run typecheck:e2e
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test --workspaces --if-present
      - name: Build du front et de l'API
        run: npm run build -w @kitchen/api && npm run build -w @kitchen/web

  # Le schéma Prisma et la chaîne de migrations doivent rester d'accord : une
  # colonne ajoutée au schéma sans migration passerait les tests unitaires et
  # casserait au déploiement.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kitchen:kitchen@localhost:5432/kitchen
      SHADOW_DATABASE_URL: postgresql://kitchen:kitchen@localhost:5432/kitchen_shadow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Appliquer les migrations sur une base vierge
        run: npx prisma migrate deploy --schema prisma/schema.prisma
      - name: Vérifier l'absence de dérive entre schéma et migrations
        run: |
          echo 'CREATE DATABASE kitchen_shadow' | npx prisma db execute --url "$DATABASE_URL" --stdin
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - name: Rejouabilité (schéma vidé puis deploy)
        run: |
          echo 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' | npx prisma db execute --url "$DATABASE_URL" --stdin
          npx prisma migrate deploy --schema prisma/schema.prisma

  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: kitchen-build-check:ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build de l'image (sans publication)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: false
          # Chargée dans le démon local pour le contrôle ci-dessous : sans
          # cela, l'image reste dans le cache de buildx et rien ne peut
          # tourner dedans.
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_VERSION=ci
          cache-from: |
            type=gha,scope=ci
            type=gha,scope=main
          cache-to: type=gha,mode=max,scope=ci

      # La porte de secours (D6) est la seule commande dont le propriétaire
      # aura besoin le jour où plus rien d'autre ne marche — et c'est la seule
      # qui dépend d'une chaîne d'emballage à part (`tsc -p tools/tsconfig.json`,
      # `.dockerignore`, deux `COPY`). Elle est donc lancée pour de vrai dans
      # l'image qui vient d'être construite, sans argument : le contrôle porte
      # sur l'emballage (le fichier existe, se charge comme module ES, résout
      # `@prisma/client` et le hachage Argon2id), pas sur le comportement, déjà
      # couvert par `apps/api/src/auth/recovery.e2e-spec.ts`.
      #
      # `--entrypoint node` : l'entrypoint de l'image joue les migrations
      # Prisma avant toute commande `node`, ce qui demanderait une base. Le
      # `DATABASE_URL` factice ne sert qu'à construire le `PrismaClient` ;
      # aucune connexion n'est ouverte, le message d'usage étant rendu avant
      # la première requête.
      - name: La commande de secours démarre dans l'image
        run: |
          set -o pipefail
          sortie="$(docker run --rm --entrypoint node \
            -e DATABASE_URL=postgresql://inutilise:inutilise@127.0.0.1:1/inutilise \
            "$IMAGE" tools/acces-secours.js 2>&1)" && code=0 || code=$?
          echo "$sortie"
          test "$code" -eq 1 || { echo "::error::code de sortie attendu 1, obtenu $code"; exit 1; }
          echo "$sortie" | grep -qF 'Usage : node tools/acces-secours.js <adresse e-mail>' \
            || { echo "::error::message d'usage absent"; exit 1; }

  # Parcours bout en bout (section 19), sur le montage jetable de la tâche 1
  # (docker-compose.e2e.yml) : jamais l'image publiée, jamais un réseau réel
  # (Open Food Facts et Gemini sont remplacés par la doublure du service
  # `stub`). Sur `main` seulement, après fusion [C4] : pas sur les pull
  # requests.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    env:
      # Tag fixe sous lequel l'image ci-dessous est chargée : docker-compose.e2e.yml
      # réutilise ce même nom (variable E2E_APP_IMAGE) pour que `docker compose up`
      # ne reconstruise pas ce que le step précédent vient de construire avec cache.
      E2E_APP_IMAGE: kitchen-e2e-app:ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - run: npm ci
      # `prisma/seed/dev.ts` importe @kitchen/shared : un paquet du monorepo,
      # qui doit être compilé avant d'être importable. `npm ci` ne fait
      # qu'installer ; sans cette étape, le seed échoue avec « Cannot find
      # module '.../dist/index.js' » avant même de toucher le navigateur.
      - run: npm run build -w @kitchen/shared
      - name: Construction de l'image du montage (cache GitHub Actions)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.E2E_APP_IMAGE }}
          build-args: |
            APP_VERSION=ci
          cache-from: |
            type=gha,scope=ci
            type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e
      - name: Démarrage du montage jetable
        run: docker compose -f docker-compose.e2e.yml up -d --wait
      - name: Endpoint de santé et migrations appliquées
        run: |
          reponse="$(curl -fsS http://localhost:3100/api/v1/health)"
          echo "$reponse"
          echo "$reponse" | jq -e '.checks.migrations == "ok"'
      - name: Installation de Playwright
        run: npx playwright install --with-deps chromium
      - name: Parcours bout en bout
        run: npm run e2e
      # Dernier cas de P5 (suggestions de recettes, tâche 7) : fournisseur de
      # vision non configuré. Exige VISION_PROVIDER=none, qui ne se change
      # qu'en recréant le service `app` — jamais en parallèle du reste de la
      # suite, qui dépend de VISION_PROVIDER=gemini (scan, suggestions). `db`
      # et `stub` ne sont pas touchés : `restoreDatabase()` fonctionne sans
      # traitement particulier dans ce fichier dédié.
      - name: Bascule du montage sans fournisseur de vision configuré
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e.none.yml up -d --wait app
      - name: Parcours bout en bout — fournisseur non configuré
        run: npm run e2e:sans-fournisseur
      - name: Journaux du conteneur applicatif
        if: always()
        run: docker compose -f docker-compose.e2e.yml logs app > app-e2e.log || true
      - name: Publication du rapport Playwright
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapport-e2e
          # Résolu par Playwright relativement à e2e/ (dossier du fichier de
          # configuration), jamais à la racine du dépôt. Dossier PARENT : les
          # deux exécutions ci-dessus écrivent chacune dans son sous-dossier
          # (`principal`, `sans-fournisseur` — voir `RUN_NAME`,
          # e2e/playwright.config.ts), la seconde n'effaçant plus le rapport
          # de la première.
          path: e2e/playwright-report/
          retention-days: 14
      - name: Publication des artefacts Playwright (traces, captures, vidéos)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artefacts-e2e
          # Même découpage que le rapport : un sous-dossier par exécution.
          path: e2e/artefacts/
          retention-days: 14
      - name: Publication des journaux applicatifs (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journaux-app-e2e
          path: app-e2e.log
          retention-days: 14
      - name: Arrêt du montage
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
