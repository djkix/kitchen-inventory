name: CI

on:
  push:
    branches: [main]
  # Les PR ouvertes par release-please ne touchent que ces deux fichiers :
  # les ignorer évite de déclencher la CI dessus.
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - ".release-please-manifest.json"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Types, lint et tests sur tout le monorepo. Les tests d'intégration API
  # tournent sur un PostgreSQL 16 jetable, même version qu'en production.
  # Aucun test ne touche le réseau : Open Food Facts et la vision sont rejoués
  # depuis des fixtures.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://kitchen:kitchen@localhost:5432/kitchen_test
      # Requis par « prisma generate » pour valider le datasource, jamais ouvert.
      DATABASE_URL: postgresql://kitchen:kitchen@localhost:5432/kitchen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run build -w @kitchen/shared
      - name: Vérification des types
        run: npm run typecheck --workspaces --if-present
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test --workspaces --if-present
      - name: Build du front et de l'API
        run: npm run build -w @kitchen/api && npm run build -w @kitchen/web

  # Le schéma Prisma et la chaîne de migrations doivent rester d'accord : une
  # colonne ajoutée au schéma sans migration passerait les tests unitaires et
  # casserait au déploiement.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitchen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kitchen:kitchen@localhost:5432/kitchen
      SHADOW_DATABASE_URL: postgresql://kitchen:kitchen@localhost:5432/kitchen_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Appliquer les migrations sur une base vierge
        run: npx prisma migrate deploy --schema prisma/schema.prisma
      - name: Vérifier l'absence de dérive entre schéma et migrations
        run: |
          echo 'CREATE DATABASE kitchen_shadow' | npx prisma db execute --url "$DATABASE_URL" --stdin
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - name: Rejouabilité (schéma vidé puis deploy)
        run: |
          echo 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' | npx prisma db execute --url "$DATABASE_URL" --stdin
          npx prisma migrate deploy --schema prisma/schema.prisma

  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            APP_VERSION=ci
          cache-from: |
            type=gha,scope=ci
            type=gha,scope=main
          cache-to: type=gha,mode=max,scope=ci

  # Parcours bout en bout (section 19), sur le montage jetable de la tâche 1
  # (docker-compose.e2e.yml) : jamais l'image publiée, jamais un réseau réel
  # (Open Food Facts et Gemini sont remplacés par la doublure du service
  # `stub`). Tourne aussi sur `tests-bout-en-bout` : clause temporaire, le temps
  # de construire ce chantier, que la dernière tâche du plan retirera pour ne
  # garder que `main`.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/tests-bout-en-bout'
    timeout-minutes: 30
    env:
      # Tag fixe sous lequel l'image ci-dessous est chargée : docker-compose.e2e.yml
      # réutilise ce même nom (variable E2E_APP_IMAGE) pour que `docker compose up`
      # ne reconstruise pas ce que le step précédent vient de construire avec cache.
      E2E_APP_IMAGE: kitchen-e2e-app:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - name: Construction de l'image du montage (cache GitHub Actions)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.E2E_APP_IMAGE }}
          build-args: |
            APP_VERSION=ci
          cache-from: |
            type=gha,scope=ci
            type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e
      - name: Démarrage du montage jetable
        run: docker compose -f docker-compose.e2e.yml up -d --wait
      - name: Endpoint de santé et migrations appliquées
        run: |
          reponse="$(curl -fsS http://localhost:3100/api/v1/health)"
          echo "$reponse"
          echo "$reponse" | jq -e '.checks.migrations == "ok"'
      # Playwright et son montage (npm run e2e, playwright.config.ts) arrivent
      # dans une tâche suivante du plan : la tâche 1 n'a livré que le montage
      # ci-dessus et sa doublure. La garde `hashFiles(...) != ''` évite de
      # faire échouer ce job tant que la suite n'existe pas ; elle disparaîtra
      # dans la même tâche qui écrira playwright.config.ts.
      - name: Installation de Playwright
        if: hashFiles('playwright.config.ts') != ''
        run: npx playwright install --with-deps chromium
      - name: Parcours bout en bout
        if: hashFiles('playwright.config.ts') != ''
        run: npm run e2e
      - name: Journaux du conteneur applicatif
        if: always()
        run: docker compose -f docker-compose.e2e.yml logs app > app-e2e.log || true
      - name: Publication du rapport Playwright
        if: always() && hashFiles('playwright.config.ts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: playwright-report/
          retention-days: 14
      - name: Publication des journaux applicatifs (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-app-e2e
          path: app-e2e.log
          retention-days: 14
      - name: Arrêt du montage
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
