name: Build and publish image

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  # Republication manuelle d'une version : utile quand la publication
  # automatique a été annulée (verrou de concurrence, incident GitHub).
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à republier (ex. v0.2.2)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Un groupe par référence construite : un build de tag (publication d'une
      # version) ne doit jamais être annulé par un push sur main arrivé entre-temps.
      # GitHub ne garde qu'un seul job en attente par groupe et annule le
      # précédent : avec un groupe unique, la 0.2.2 n'a jamais été publiée.
      group: docker-build-${{ inputs.tag || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Les valeurs saisies (`inputs.tag`, nom du tag poussé) passent par
      # l'environnement, jamais interpolées dans le script : un tag
      # `v1.2.3$(…)` serait sinon exécuté par le shell. Elles sont ensuite
      # validées contre le format d'une version publiée.
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG_NAME="$REF_NAME"
          else
            TAG_NAME=""
          fi
          if [ -n "$TAG_NAME" ] && ! printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag de version invalide (attendu vX.Y.Z)"
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          # Sans tag (push sur main), l'image affiche la dernière version
          # publiée d'après le manifeste plutôt qu'un identifiant de commit.
          if [ -n "$VERSION" ]; then
            echo "display=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "display=$(node -p "require('./.release-please-manifest.json')['.']")-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          # « latest » ne suit que les versions publiées : un déploiement qui
          # la vise ne reçoit jamais un commit de développement. Les poussées
          # sur main sont publiées sous « main », pour essai seulement.
          tags: |
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ steps.version.outputs.value != '' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.value != '' }}
            type=raw,value=main,enable=${{ steps.version.outputs.value == '' }}

      # amd64 seulement : l'hôte de déploiement est un mini-PC x86. La section 9
      # du cahier des charges prévoit aussi arm64, mais sa construction passait
      # par l'émulation QEMU, qui échouait par intermittence sur une instruction
      # illégale (code 132) et doublait la durée du build. À rétablir le jour où
      # un hôte arm entre en jeu, de préférence sur un exécuteur arm natif.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.display }}
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main
