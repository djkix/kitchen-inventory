services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: inventaire:latest
    container_name: inventaire-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      VISION_PROVIDER: ${VISION_PROVIDER}
      VISION_API_KEY: ${VISION_API_KEY}
      VISION_MODEL: ${VISION_MODEL}
      OFF_USER_AGENT: ${OFF_USER_AGENT}
      EXPIRY_ALERT_DAYS: ${EXPIRY_ALERT_DAYS}
      TZ: ${TZ}
    volumes:
      - ./media:/app/media
    ports:
      # Exposé uniquement au reverse proxy, jamais publié tel quel.
      - "127.0.0.1:8090:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: inventaire-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:16-alpine
    container_name: inventaire-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./backups:/backups
      - ./media:/media:ro
    entrypoint: >
      sh -c 'while true; do
        h=$$(date +%H);
        if [ "$$h" = "03" ]; then
          d=$$(date +%Y-%m-%d);
          pg_dump -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} | gzip > /backups/db-$$d.sql.gz &&
          tar czf /backups/media-$$d.tar.gz -C / media &&
          find /backups -name "*.gz" -mtime +30 -delete;
          sleep 3600;
        fi;
        sleep 600;
      done'
