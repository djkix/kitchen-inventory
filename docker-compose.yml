# Stack de production (section 9) : trois services, image publiée sur GHCR.
# Le TLS et le nom de domaine sont assurés par le reverse proxy existant, qui
# n'a besoin que du port de « app ». Copier .env.example vers .env d'abord :
# NAS_OPTIONS et NAS_CHEMIN y sont obligatoires (sauvegarde vers le NAS).
services:
  app:
    image: ghcr.io/djkix/kitchen-inventory:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VISION_PROVIDER: ${VISION_PROVIDER:-none}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      GEMINI_RPM: ${GEMINI_RPM:-}
      GEMINI_TPM: ${GEMINI_TPM:-}
      GEMINI_RPD: ${GEMINI_RPD:-}
      SUGGESTION_WEB_SEARCH: ${SUGGESTION_WEB_SEARCH:-}
      VISION_DAILY_QUOTA: ${VISION_DAILY_QUOTA:-50}
      RECIPE_SUGGESTION_DAILY_QUOTA: ${RECIPE_SUGGESTION_DAILY_QUOTA:-20}
      RECEIPT_DAILY_QUOTA: ${RECEIPT_DAILY_QUOTA:-10}
      VISION_MONTHLY_CAP_CENTS: ${VISION_MONTHLY_CAP_CENTS:-500}
      OFF_USER_AGENT: ${OFF_USER_AGENT:-KitchenInventory/0.1 (self-hosted; https://github.com/djkix/kitchen-inventory)}
      EXPIRY_ALERT_DAYS: ${EXPIRY_ALERT_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ${MEDIA_DIR:-./media}:/app/media
    ports:
      # Exposé au reverse proxy seulement, jamais publié tel quel sur Internet.
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8888}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ${PGDATA_DIR:-./pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sauvegarde vers le NAS : chaque jour après 3 h (heure de TZ), base, médias
  # et configuration de la stack dans un dossier daté, sept jours gardés, sans
  # chiffrement (docker/backup/). Même image que « app ». Rien n'en dépend :
  # NAS éteint, seul ce conteneur ne démarre pas, et Réglages › Sauvegarde le
  # signale au bout de 36 h.
  backup:
    image: ghcr.io/djkix/kitchen-inventory:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    user: node
    entrypoint: ["/app/backup/schedule.sh"]
    # « app » saine a joué les migrations : la table BackupAttempt existe avant
    # la première inscription.
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Une base injoignable ne bloque pas la boucle de schedule.sh : 10 s pour se connecter.
      PGCONNECT_TIMEOUT: "10"
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ${MEDIA_DIR:-./media}:/data/media:ro
      # Le dossier de la stack, pour en copier le fichier compose et le .env.
      - ./:/stack:ro
      - nas:/nas

volumes:
  # NAS du réseau local, en NFS ; adresse et chemin dans le .env, jamais dans le
  # dépôt. Sans NAS (développement) : NAS_TYPE=none, NAS_OPTIONS=bind et
  # NAS_CHEMIN=un dossier local existant.
  nas:
    driver: local
    driver_opts:
      type: ${NAS_TYPE:-nfs}
      o: ${NAS_OPTIONS:?NAS_OPTIONS vide, par exemple addr=<IP du NAS>,nfsvers=4.1,soft,timeo=150,retrans=3}
      device: ${NAS_CHEMIN:?NAS_CHEMIN vide, par exemple :/volumeN/<partage>/<dossier>}
